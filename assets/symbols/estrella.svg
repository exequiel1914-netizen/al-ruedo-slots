<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="starMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fa"/>
      <stop offset=".25" stop-color="#9aa7b1"/>
      <stop offset=".52" stop-color="#313b44"/>
      <stop offset=".75" stop-color="#c8d1d7"/>
      <stop offset="1" stop-color="#59656f"/>
    </linearGradient>

    <linearGradient id="electricBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".45" stop-color="#009dff"/>
      <stop offset="1" stop-color="#004bd6"/>
    </linearGradient>

    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#bff6ff"/>
      <stop offset=".65" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#0062df"/>
    </radialGradient>

    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sombra -->
  <ellipse cx="100" cy="171" rx="55" ry="9"
           fill="#000000" opacity=".65"/>

  <!-- halo -->
  <circle cx="100" cy="96" r="67"
          fill="none"
          stroke="#008cff"
          stroke-width="3"
          opacity=".28"
          filter="url(#blueGlow)"/>

  <!-- estrella exterior -->
  <path d="M100 23
           L119 68
           L168 72
           L130 103
           L142 151
           L100 125
           L58 151
           L70 103
           L32 72
           L81 68 Z"
        fill="url(#starMetal)"
        stroke="#111820"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- estrella interior azul -->
  <path d="M100 42
           L114 77
           L151 80
           L122 103
           L131 139
           L100 119
           L69 139
           L78 103
           L49 80
           L86 77 Z"
        fill="url(#electricBlue)"
        stroke="#00c8ff"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#blueGlow)"/>

  <!-- núcleo -->
  <circle cx="100" cy="96" r="22"
          fill="url(#core)"
          stroke="#dffaff"
          stroke-width="3"/>

  <!-- reflejos -->
  <path d="M72 73 L91 67"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        opacity=".7"/>

  <path d="M119 113 L129 126"
        stroke="#bdefff"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".6"/>

  <!-- insignia -->
  <circle cx="100" cy="96" r="10"
          fill="#071018"
          stroke="#00c8ff"
          stroke-width="2"/>

  <text x="100" y="100"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700"
        fill="#ffffff">AR</text>
</svg>