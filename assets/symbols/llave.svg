<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".28" stop-color="#a9c1cf"/>
      <stop offset=".55" stop-color="#526d7c"/>
      <stop offset=".78" stop-color="#d8edf5"/>
      <stop offset="1" stop-color="#708b9a"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42d5ff"/>
      <stop offset="1" stop-color="#0077bd"/>
    </linearGradient>
  </defs>

  <!-- LLAVE -->
  <g transform="rotate(-42 150 150)">

    <!-- CABEZA ABIERTA -->
    <path d="
      M126 38
      L105 16
      L117 5
      L145 30
      L173 5
      L185 16
      L164 38
      L164 70
      L126 70
      Z"
      fill="url(#metal)"
      stroke="#20bfff"
      stroke-width="6"
      stroke-linejoin="round"/>

    <!-- MANGO -->
    <path d="
      M128 64
      L162 64
      L169 211
      Q169 224 158 232
      L132 232
      Q121 224 121 211
      Z"
      fill="url(#metal)"
      stroke="#20bfff"
      stroke-width="6"/>

    <!-- REFLEJO MANGO -->
    <path d="M137 79 L141 199"
      stroke="#ffffff"
      stroke-opacity=".6"
      stroke-width="7"
      stroke-linecap="round"/>

    <!-- CABEZA ESTRELLA -->
    <circle cx="145" cy="244" r="35"
      fill="url(#metal)"
      stroke="#20bfff"
      stroke-width="7"/>

    <!-- AGUJERO -->
    <circle cx="145" cy="244" r="17"
      fill="#0b1c27"
      stroke="#9de9ff"
      stroke-width="5"/>

    <!-- DETALLE AZUL -->
    <circle cx="145" cy="244" r="24"
      fill="none"
      stroke="url(#blue)"
      stroke-width="4"/>
  </g>
</svg>
