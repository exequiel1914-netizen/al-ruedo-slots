<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <defs>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset=".45" stop-color="#83d8e8"/>
      <stop offset="1" stop-color="#168aa9"/>
    </linearGradient>
  </defs>

  <!-- billetes traseros -->
  <g transform="rotate(-10 150 120)">
    <rect x="48" y="67" width="190" height="105" rx="10"
          fill="#195b70" stroke="#28caff" stroke-width="6"/>
  </g>

  <g transform="rotate(7 150 120)">
    <rect x="60" y="58" width="190" height="105" rx="10"
          fill="#397f8d" stroke="#7ee7ff" stroke-width="6"/>
  </g>

  <!-- billete principal -->
  <rect x="50" y="61" width="200" height="112" rx="12"
        fill="url(#money)" stroke="#16bfff" stroke-width="7"/>

  <!-- marco interior -->
  <rect x="65" y="76" width="170" height="82" rx="8"
        fill="none" stroke="#075c78" stroke-width="5"/>

  <!-- círculo central -->
  <circle cx="150" cy="117" r="31"
          fill="#083c50" stroke="#d9fbff" stroke-width="5"/>

  <text x="150" y="130"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="39"
        font-weight="900"
        fill="#8eeaff">$</text>

  <!-- números grandes -->
  <text x="77" y="101"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="900"
        fill="#07536b">100</text>

  <text x="223" y="151"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="900"
        fill="#07536b">100</text>

  <!-- banda del fajo -->
  <rect x="129" y="51" width="42" height="132" rx="7"
        fill="#dff8ff" fill-opacity=".88"
        stroke="#159dc1" stroke-width="4"/>

  <text x="150" y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="31"
        font-weight="900"
        fill="#07536b">$</text>
</svg>
