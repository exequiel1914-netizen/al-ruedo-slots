<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="moneyG" x1="0" x2="1"><stop offset="0" stop-color="#dffcff"/><stop offset="1" stop-color="#013b2f"/></linearGradient>
  </defs>

  <!-- stack of bills, clear symbol in center for small sizes -->
  <g transform="translate(12,30)">
    <rect x="0" y="8" width="156" height="78" rx="8" fill="#04151a" stroke="#0aa6ff" stroke-width="2"/>
    <rect x="10" y="2" width="136" height="70" rx="6" fill="url(#moneyG)" stroke="#0aa6ff" stroke-width="1.6"/>
    <circle cx="78" cy="36" r="12" fill="#021218" stroke="#e6fbff" stroke-width="1.2"/>
    <!-- simple currency mark stylized to read small -->
    <text x="78" y="42" text-anchor="middle" font-size="12" fill="#bff8ff" font-weight="700" font-family="Arial">$</text>
  </g>
</svg>
