<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="tire" cx="40%" cy="35%">
      <stop offset="0" stop-color="#343b42"/>
      <stop offset=".45" stop-color="#11161b"/>
      <stop offset="1" stop-color="#020304"/>
    </radialGradient>

    <radialGradient id="rim">
      <stop offset="0" stop-color="#77838d"/>
      <stop offset=".45" stop-color="#222b33"/>
      <stop offset="1" stop-color="#080c10"/>
    </radialGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".5" stop-color="#008cff"/>
      <stop offset="1" stop-color="#004ac7"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sombra -->
  <ellipse cx="100" cy="174" rx="58" ry="9"
           fill="#000" opacity=".65"/>

  <!-- neumático -->
  <circle cx="100" cy="98" r="72"
          fill="url(#tire)"
          stroke="#4c555d"
          stroke-width="5"/>

  <!-- dibujo del neumático -->
  <g fill="none"
     stroke="#505961"
     stroke-width="5"
     stroke-linecap="round"
     opacity=".75">
    <path d="M63 39 L72 54"/>
    <path d="M42 61 L58 70"/>
    <path d="M31 91 L50 94"/>
    <path d="M34 123 L52 117"/>
    <path d="M52 148 L65 133"/>

    <path d="M137 39 L128 54"/>
    <path d="M158 61 L142 70"/>
    <path d="M169 91 L150 94"/>
    <path d="M166 123 L148 117"/>
    <path d="M148 148 L135 133"/>
  </g>

  <!-- aro azul -->
  <circle cx="100" cy="98" r="54"
          fill="#080c10"
          stroke="url(#blue)"
          stroke-width="6"
          filter="url(#glow)"/>

  <!-- llanta -->
  <circle cx="100" cy="98" r="45"
          fill="url(#rim)"
          stroke="#7c8790"
          stroke-width="3"/>

  <!-- rayos deportivos -->
  <g fill="url(#blue)"
     stroke="#071018"
     stroke-width="2">
    <path d="M95 91 L76 55 L88 51 L103 88 Z"/>
    <path d="M107 91 L143 70 L147 82 L111 101 Z"/>
    <path d="M109 106 L128 141 L116 146 L99 110 Z"/>
    <path d="M92 106 L57 127 L52 115 L89 97 Z"/>
    <path d="M100 88 L102 48 L114 51 L108 91 Z"/>
  </g>

  <!-- centro -->
  <circle cx="100" cy="98" r="18"
          fill="#111820"
          stroke="#00bfff"
          stroke-width="4"/>

  <circle cx="100" cy="98" r="7"
          fill="#cbd4da"
          stroke="#313b43"
          stroke-width="3"/>

  <!-- tornillos -->
  <g fill="#d8e0e5">
    <circle cx="100" cy="84" r="2.5"/>
    <circle cx="113" cy="94" r="2.5"/>
    <circle cx="108" cy="110" r="2.5"/>
    <circle cx="92" cy="110" r="2.5"/>
    <circle cx="87" cy="94" r="2.5"/>
  </g>

  <!-- reflejo metálico -->
  <path d="M57 68 Q78 43 104 43"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".25"/>

  <!-- detalle AR -->
  <text x="100" y="102"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="8"
        font-weight="700"
        fill="#ffffff">AR</text>
</svg>
