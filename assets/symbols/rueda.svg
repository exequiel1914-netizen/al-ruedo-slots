<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="rimRad" cx="0.3" cy="0.3"><stop offset="0" stop-color="#eaffff"/><stop offset="1" stop-color="#032f3a"/></radialGradient>
  </defs>

  <!-- outer tyre -->
  <circle cx="100" cy="100" r="78" fill="#04121a"/>
  <!-- rim -->
  <circle cx="100" cy="100" r="56" fill="url(#rimRad)" stroke="#0aa6ff" stroke-width="6"/>
  <!-- spokes (clear, few, thick for legibility) -->
  <g transform="translate(100,100)" stroke="#022a33" stroke-width="4">
    <line x1="0" y1="-6" x2="0" y2="-48"/>
    <line x1="-6" y1="0" x2="-48" y2="0"/>
    <line x1="6" y1="0" x2="48" y2="0"/>
    <line x1="0" y1="6" x2="0" y2="48"/>
  </g>
  <!-- hub -->
  <circle cx="100" cy="100" r="16" fill="#021418" stroke="#80e8ff" stroke-width="2.6"/>
</svg>
