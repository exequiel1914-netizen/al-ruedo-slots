<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6f8"/>
      <stop offset=".25" stop-color="#89959e"/>
      <stop offset=".5" stop-color="#252e35"/>
      <stop offset=".75" stop-color="#c5cdd2"/>
      <stop offset="1" stop-color="#59646c"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".45" stop-color="#009dff"/>
      <stop offset="1" stop-color="#0048cc"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset=".28" stop-color="#ffd45a"/>
      <stop offset=".55" stop-color="#c99119"/>
      <stop offset=".78" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#9c6810"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop offset="0" stop-color="#12334b"/>
      <stop offset=".6" stop-color="#071018"/>
      <stop offset="1" stop-color="#020406"/>
    </radialGradient>

    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sombra -->
  <ellipse cx="100" cy="174" rx="62" ry="10"
           fill="#000000" opacity=".7"/>

  <!-- halo azul -->
  <circle cx="100" cy="96" r="73"
          fill="none"
          stroke="#008cff"
          stroke-width="3"
          opacity=".32"
          filter="url(#blueGlow)"/>

  <!-- ficha exterior -->
  <circle cx="100" cy="96" r="65"
          fill="#070b0f"
          stroke="url(#metal)"
          stroke-width="8"/>

  <!-- aro dorado -->
  <circle cx="100" cy="96" r="55"
          fill="url(#centerGlow)"
          stroke="url(#gold)"
          stroke-width="5"
          filter="url(#goldGlow)"/>

  <!-- aro azul interior -->
  <circle cx="100" cy="96" r="46"
          fill="none"
          stroke="url(#blue)"
          stroke-width="3"/>

  <!-- rueda estilizada AR -->
  <circle cx="100" cy="77" r="25"
          fill="#080d12"
          stroke="#00bfff"
          stroke-width="4"
          filter="url(#blueGlow)"/>

  <circle cx="100" cy="77" r="17"
          fill="none"
          stroke="#6d7881"
          stroke-width="3"/>

  <g stroke="#00bfff" stroke-width="3">
    <path d="M100 60 V94"/>
    <path d="M83 77 H117"/>
    <path d="M88 65 L112 89"/>
    <path d="M112 65 L88 89"/>
  </g>

  <!-- AR -->
  <text x="100" y="82"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="900"
        fill="#ffffff">AR</text>

  <!-- AL RUEDO -->
  <text x="100" y="116"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="900"
        letter-spacing="1"
        fill="#e9eef1">AL RUEDO</text>

  <!-- BONUS -->
  <rect x="57" y="126" width="86" height="25" rx="9"
        fill="#070a0d"
        stroke="url(#gold)"
        stroke-width="3"/>

  <text x="100" y="144"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="900"
        letter-spacing="2"
        fill="#ffd65b">BONUS</text>

  <!-- destellos -->
  <g fill="#ffe47d" filter="url(#goldGlow)">
    <path d="M39 52 L42 61 L51 64 L42 67 L39 76 L36 67 L27 64 L36 61 Z"/>
    <path d="M159 39 L161 46 L168 48 L161 50 L159 57 L157 50 L150 48 L157 46 Z"/>
    <circle cx="157" cy="132" r="3"/>
  </g>
</svg>