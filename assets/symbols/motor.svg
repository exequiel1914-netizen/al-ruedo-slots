<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#718a99"/>
      <stop offset=".25" stop-color="#e7f5fb"/>
      <stop offset=".5" stop-color="#8099a8"/>
      <stop offset=".75" stop-color="#d8edf5"/>
      <stop offset="1" stop-color="#627b89"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45d2ff"/>
      <stop offset=".5" stop-color="#0796d8"/>
      <stop offset="1" stop-color="#005c9c"/>
    </linearGradient>
  </defs>

  <!-- MANGUERA SUPERIOR -->
  <path d="M190 58
           C220 42 245 48 257 68
           L268 83"
        fill="none"
        stroke="#17252d"
        stroke-width="18"
        stroke-linecap="round"/>

  <path d="M190 58
           C220 42 245 48 257 68"
        fill="none"
        stroke="#35bff3"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- CUERPO EXTERIOR -->
  <rect x="52" y="55"
        width="157" height="118"
        rx="13"
        fill="#142630"
        stroke="#41caff"
        stroke-width="8"/>

  <!-- TANQUES LATERALES -->
  <rect x="40" y="68"
        width="22" height="91"
        rx="8"
        fill="url(#blue)"
        stroke="#b8ecff"
        stroke-width="4"/>

  <rect x="201" y="68"
        width="22" height="91"
        rx="8"
