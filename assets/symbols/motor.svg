  <!-- ALETAS VERTICALES -->
  <g stroke="#304b59" stroke-width="5">
    <line x1="80" y1="73" x2="80" y2="155"/>
    <line x1="94" y1="73" x2="94" y2="155"/>
    <line x1="108" y1="73" x2="108" y2="155"/>
    <line x1="122" y1="73" x2="122" y2="155"/>
    <line x1="136" y1="73" x2="136" y2="155"/>
    <line x1="150" y1="73" x2="150" y2="155"/>
    <line x1="164" y1="73" x2="164" y2="155"/>
    <line x1="178" y1="73" x2="178" y2="155"/>
  </g>

  <!-- ALETAS HORIZONTALES -->
  <g stroke="#8fc6dc" stroke-width="3">
    <line x1="69" y1="86" x2="192" y2="86"/>
    <line x1="69" y1="103" x2="192" y2="103"/>
    <line x1="69" y1="120" x2="192" y2="120"/>
    <line x1="69" y1="137" x2="192" y2="137"/>
  </g>

  <!-- CUELLO / TAPA -->
  <path d="M92 55 L92 40 Q92 31 102 31 H132 Q142 31 142 40 V55"
