<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bodyGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#0bf" />
      <stop offset="1" stop-color="#02384f" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f7feff"/>
      <stop offset="0.5" stop-color="#bfeeff"/>
      <stop offset="1" stop-color="#083142"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wheels (clear, high-contrast for small sizes) -->
  <g id="wheels">
    <circle cx="56" cy="136" r="30" fill="#031017"/>
    <circle cx="56" cy="136" r="20" fill="url(#chromeGrad)" stroke="#0aa6ff" stroke-width="3"/>
    <circle cx="144" cy="136" r="30" fill="#031017"/>
    <circle cx="144" cy="136" r="20" fill="url(#chromeGrad)" stroke="#0aa6ff" stroke-width="3"/>
  </g>

  <!-- Exhaust (identifiable) -->
  <g id="exhaust" transform="translate(0,0)">
    <path d="M140 110 C150 108 160 112 168 118" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="170" cy="120" rx="6" ry="4" fill="#06151a"/>
  </g>

  <!-- Frame / tank / seat / engine -->
  <g id="frame" transform="translate(0,0)">
    <!-- tank -->
    <path d="M64 78 C84 64 110 60 134 68 C142 72 148 78 152 86 L136 92 C128 88 108 86 90 92 C74 96 66 92 64 90 Z"
          fill="url(#bodyGrad)" stroke="url(#chromeGrad)" stroke-width="1.8"/>
    <!-- tank number 110 (small) -->
    <text x="96" y="78" font-size="10" font-weight="700" text-anchor="middle" fill="#dffaff" opacity="0.95">110</text>
    <!-- seat -->
    <path d="M92 94 L126 88 L138 96 L110 104 Z" fill="#071421" stroke="#0aa6ff" stroke-width="1.2"/>
    <!-- engine block (recognizable cylinders) -->
    <g transform="translate(84,98)">
      <rect x="-14" y="2" width="28" height="18" rx="3" fill="#072027" stroke="url(#chromeGrad)" stroke-width="1.2"/>
      <rect x="-22" y="8" width="8" height="6" rx="1" fill="#071f22"/>
      <rect x="14" y="8" width="8" height="6" rx="1" fill="#071f22"/>
    </g>
    <!-- small details: bolts -->
    <circle cx="96" cy="118" r="3" fill="#0aa6ff"/>
  </g>

  <!-- Handlebars and headlight (headlight has id=headlight for animation) -->
  <g id="front" transform="translate(0,0)">
    <path d="M150 64 L168 52" stroke="#072a3a" stroke-width="4" stroke-linecap="round"/>
    <g id="headlight">
      <ellipse cx="152" cy="76" rx="10" ry="8" fill="#f2fbff" stroke="url(#chromeGrad)" stroke-width="1.2"/>
      <path class="glint" d="M142 70 C146 66 150 64 154 68" fill="none" stroke="#e7fdff" stroke-width="1" opacity="0.9"/>
    </g>
  </g>

  <!-- silhouette outline for readability on dark bg -->
  <path d="M24 124 L44 120 C50 96 64 86 86 86 C110 86 134 96 146 112 L170 112" fill="none" stroke="rgba(10,160,255,0.08)" stroke-width="10" stroke-linecap="round"/>

  <!-- subtle outer glow to help read on dark panel -->
  <g filter="url(#soft)" opacity="0.6">
    <ellipse cx="100" cy="118" rx="72" ry="44" fill="none" stroke="rgba(10,160,255,0.06)" stroke-width="10"/>
  </g>
</svg>
