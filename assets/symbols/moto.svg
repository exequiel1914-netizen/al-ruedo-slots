  <!-- ruedas -->
  <circle cx="72" cy="151" r="31" fill="#111820" stroke="#9eb4c3" stroke-width="5"/>
  <circle cx="72" cy="151" r="14" fill="#536a79" stroke="#d9edf7" stroke-width="4"/>
  <circle cx="229" cy="151" r="31" fill="#111820" stroke="#9eb4c3" stroke-width="5"/>
  <circle cx="229" cy="151" r="14" fill="#536a79" stroke="#d9edf7" stroke-width="4"/>

  <!-- guardabarros delantero -->
  <path d="M202 121 Q230 103 256 126" fill="none" stroke="#47baff" stroke-width="9" stroke-linecap="round"/>

