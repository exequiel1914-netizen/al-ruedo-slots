  <defs>
    <linearGradient id="cascoShell" x1="0" x2="1">
      <stop offset="0" stop-color="#bff6ff"/>
      <stop offset="1" stop-color="#04324a"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" x2="1"><stop offset="0" stop-color="#eaffff"/><stop offset="1" stop-color="#0a6ea0"/></linearGradient>
